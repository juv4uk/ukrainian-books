<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="nazva opys">
  <title id="nazva">Аштавакра-ґіта 13.5 — постава не визначає користі й шкоди</title>
  <desc id="opys">Три редакторські ситуації: людина стоїть, іде та відпочиває. Вони сходяться в одному висновку — ні користі, ні шкоди лише від постави. Нижче рефрен: «Я сиджу, як мені завгодно». Схема є сучасним українським поясненням парадоксу, а не історичною ілюстрацією.</desc>
  <rect width="960" height="620" fill="#f7f5ef"/>
  <rect x="24" y="24" width="912" height="572" rx="20" fill="#fffdf8" stroke="#c6cbbf" stroke-width="2"/>
  <text x="480" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="29" fill="#263f3d">Три постави — одна свобода від рахунку</text>
  <text x="480" y="105" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#5b6964">Аштавакра-ґіта, 13.5 · авторська схема для українського читача</text>
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <rect x="56" y="142" width="264" height="206" rx="20" fill="#e5eee9" stroke="#8ba69c" stroke-width="2"/>
