<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="z-nazva z-opys">
  <title id="z-nazva">Океан і бульбашка — схема до «Аштавакра-ґіти» 5.2</title>
  <desc id="z-opys">На світлому тлі зображено єдиний широкий океан із хвилями. Над поверхнею підіймається одна прозора округла бульбашка, нижній край якої торкається води. Це умовний образ виникнення світу з океану, не картина місця або історичної події.</desc>
  <rect width="1200" height="680" fill="#F8F4E9"/>
  <rect x="23" y="23" width="1154" height="634" rx="20" fill="none" stroke="#45606A" stroke-width="3"/>
  <g fill="#233F4E" font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="600" y="88" font-size="35" font-weight="bold">Світ — мов бульбашка з океану</text>
    <text x="600" y="120" font-size="19">Аштавакра-ґіта · 5.2 · власна умовна схема</text>
  </g>
