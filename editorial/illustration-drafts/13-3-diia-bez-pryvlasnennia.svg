<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="scheme-title scheme-desc">
  <title id="scheme-title">Аштавакра-ґіта 13.3: дія без привласнення результату</title>
  <desc id="scheme-desc">Сучасна українська навчальна схема, три етапи зліва направо: після дощу місток потребує ремонту, людина працює з дошкою, місток відкритий для громади без таблиці особистої слави.</desc>
  <rect width="1100" height="660" fill="#FAF7F0"/>
  <rect x="24" y="24" width="1052" height="612" rx="20" stroke="#59747A" fill="none" stroke-width="2"/>
  <g font-family="sans-serif" fill="#213C43" text-anchor="middle">
    <text x="550" y="77" font-size="32" font-weight="700">Справа є — привласнення не обов'язкове</text>
    <text x="550" y="116" font-size="20">«Аштавакра-ґіта» 13.3 · українська навчальна аналогія</text>
  </g>
  <g stroke-width="2.5">
    <rect x="53" y="166" width="295" height="357" rx="17" fill="#EBEEF0" stroke="#647E86"/>
    <rect x="402" y="166" width="295" height="357" rx="17" fill="#F1EBDD" stroke="#9D8459"/>
    <rect x="751" y="166" width="295" height="357" rx="17" fill="#E9F0E9" stroke="#648675"/>
  </g>
  <g font-family="sans-serif" fill="#213C43" text-anchor="middle">
    <text x="200" y="211" font-size="22" font-weight="700">1. Виникла потреба</text>
    <text x="549" y="211" font-size="22" font-weight="700">2. Виконано справу</text>
    <text x="899" y="211" font-size="22" font-weight="700">3. Користь для всіх</text>
    <text x="200" y="477" font-size="19">Місток пошкоджено</text>
    <text x="549" y="477" font-size="19">Праця без показу себе</text>
    <text x="899" y="477" font-size="19">Місток знову відкритий</text>
  </g>
  <g fill="none" stroke="#59727C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M97 399 L132 366 L164 394 M232 383 L271 359 L308 396"/>
    <path d="M94 418 L306 418 M100 414 L145 374 M251 375 L303 417"/>
    <path d="M453 410 L644 410 M460 401 L520 377 L571 395 L637 379"/>
    <circle cx="544" cy="310" r="20" />
    <path d="M544 331 L541 390 M541 354 L500 377 M541 354 L593 371 M541 390 L514 421 M541 390 L578 418"/>
    <path d="M794 403 L999 403 M804 403 L804 378 M839 403 L839 378 M874 403 L874 378 M909 403 L909 378 M944 403 L944 378 M979 403 L979 378 M793 378 L1004 378"/>
