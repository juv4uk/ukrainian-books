  <g font-family="sans-serif" font-size="28" font-weight="700" fill="#42656A" text-anchor="middle">
    <text x="374" y="340">→</text>
    <text x="725" y="340">→</text>
  </g>
  <g font-family="sans-serif" fill="#213C43" text-anchor="middle">
    <text x="550" y="571" font-size="20">Образ не належить давньому тексту й не є доказом санскритського читання.</text>
    <text x="550" y="603" font-size="16">Авторська векторна схема для українського читача</text>
  </g>
</svg>