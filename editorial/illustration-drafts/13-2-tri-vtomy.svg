<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Аштавакра-ґіта 13.2 — три різні втоми та їх відпускання</title>
  <desc id="desc">Три окремі кола з українськими написами «Тіло», «Язик і мовлення», «Розум» з'єднуються пунктирними лініями в центр «Відкинувши це». Праворуч розташовано рамку «Перебуваю щасливо». Схема показує граматичну будову 13.2, не засуджуючи працю чи говоріння.</desc>
  <rect width="1200" height="650" fill="#faf8f2"/>
  <rect x="34" y="32" width="1132" height="586" rx="22" fill="#fffefa" stroke="#bbb6aa" stroke-width="2"/>
  <g fill="#243e47" font-family="sans-serif" text-anchor="middle">
    <text x="600" y="92" font-size="34" font-weight="700">Три втоми — не вся людина</text>
    <text x="600" y="128" font-size="21">Смислова схема до Аштавакра-ґіти · 13.2</text>
  </g>
  <g stroke="#68858b" fill="#ecf3f1" stroke-width="3">
    <circle cx="178" cy="234" r="76"/>
    <circle cx="178" cy="388" r="76"/>
    <circle cx="178" cy="542" r="76"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#28434b">
    <text x="178" y="226" font-size="24" font-weight="700">Тіло</text>
    <text x="178" y="256" font-size="17">kāya</text>
    <text x="178" y="380" font-size="21" font-weight="700">Язик</text>
    <text x="178" y="408" font-size="17">jihvā</text>
    <text x="178" y="534" font-size="24" font-weight="700">Розум</text>
    <text x="178" y="564" font-size="17">manas</text>
  </g>
  <g stroke="#789397" stroke-width="4" stroke-dasharray="9 11" stroke-linecap="round" fill="none">
    <path d="M254 234 C332 234 355 330 436 357"/>
    <path d="M254 388 H428"/>
    <path d="M254 542 C332 542 355 446 436 419"/>
  </g>
  <g fill="#e8edf7" stroke="#6983ac" stroke-width="3">
    <rect x="430" y="276" width="310" height="224" rx="26"/>
  </g>
  <g font-family="sans-serif" fill="#28415f" text-anchor="middle">
    <text x="585" y="340" font-size="26" font-weight="700">Відкинувши це</text>
    <text x="585" y="375" font-size="20">tat tyaktvā</text>
    <text x="585" y="417" font-size="17">Не заперечити тіло,</text>
    <text x="585" y="442" font-size="17">мову або думку,</text>
    <text x="585" y="467" font-size="17">а відпустити обтяженість</text>
  </g>
  <path d="M742 388 H840 M819 374 L843 388 L819 402" fill="none" stroke="#597d60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="842" y="277" width="278" height="223" rx="26" fill="#e7f1e7" stroke="#6b9371" stroke-width="3"/>
  <g fill="#2d5938" font-family="sans-serif" text-anchor="middle">
    <text x="981" y="338" font-size="26" font-weight="700">Перебуваю</text>
    <text x="981" y="371" font-size="26" font-weight="700">щасливо</text>
    <text x="981" y="413" font-size="19">sthitaḥ sukham</text>
    <text x="981" y="452" font-size="17">Зміст потребує</text>
    <text x="981" y="476" font-size="17">фахового тлумачення</text>
  </g>
  <text x="600" y="591" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5e6866">Власна українська навчальна композиція · не зображення рукопису й не історична ілюстрація</text>
</svg>
