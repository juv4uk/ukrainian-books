<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Аштавакра-ґіта 13.3 — дія без привласнення</title>
  <desc id="desc">Схема із чотирьох послідовних кроків: перший — теза «Зробленого немає» як філософський погляд; другий — розмисел по суті; третій — справа, що приходить; четвертий — дія виконана, спокій залишається. Українське пояснення: відсутність привласнення дії не дорівнює бездіяльності.</desc>
  <defs>
    <marker id="strilka" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486b70"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#f8f7f1"/>
  <rect x="34" y="30" width="1132" height="595" rx="24" fill="#ffffff" stroke="#c9cbc3" stroke-width="2"/>
  <text x="600" y="85" font-family="sans-serif" font-size="35" font-weight="700" text-anchor="middle" fill="#233f4d">Дія без привласнення</text>
  <text x="600" y="120" font-family="sans-serif" font-size="23" text-anchor="middle" fill="#54646b">Аштавакра-ґіта · вірш 13.3 · авторська українська смислова схема</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="210" width="245" height="205" rx="16" fill="#eef3f1" stroke="#68858b" stroke-width="3"/>
    <text x="182" y="251" font-size="20" fill="#456873">1 · ТЕЗА</text>
    <text x="182" y="304" font-size="24" font-weight="700" fill="#203e49">«Зробленого</text>
    <text x="182" y="338" font-size="24" font-weight="700" fill="#203e49">немає»</text>
    <text x="182" y="380" font-size="16" fill="#456873">погляд, не заборона</text>

    <rect x="337" y="210" width="245" height="205" rx="16" fill="#eef1f8" stroke="#6d7b9a" stroke-width="3"/>
    <text x="459" y="251" font-size="20" fill="#4b5c83">2 · РОЗМИСЕЛ</text>
    <text x="459" y="304" font-size="24" font-weight="700" fill="#283c60">По суті</text>
    <text x="459" y="338" font-size="24" font-weight="700" fill="#283c60">осмислено</text>
    <text x="459" y="380" font-size="16" fill="#4b5c83">tattvataḥ</text>

    <rect x="614" y="210" width="245" height="205" rx="16" fill="#fcf1e6" stroke="#b58b65" stroke-width="3"/>
    <text x="736" y="251" font-size="20" fill="#8d6240">3 · НАГОДА</text>
    <text x="736" y="304" font-size="24" font-weight="700" fill="#6c482f">Справа</text>
    <text x="736" y="338" font-size="24" font-weight="700" fill="#6c482f">приходить</text>
    <text x="736" y="380" font-size="16" fill="#8d6240">kartum āyāti</text>

    <rect x="891" y="210" width="245" height="205" rx="16" fill="#f0f4e9" stroke="#7d9363" stroke-width="3"/>
    <text x="1013" y="251" font-size="20" fill="#607b49">4 · ВІДПОВІДЬ</text>
    <text x="1013" y="304" font-size="24" font-weight="700" fill="#425e3b">Зроблено.</text>
    <text x="1013" y="338" font-size="24" font-weight="700" fill="#425e3b">Є спокій.</text>
    <text x="1013" y="380" font-size="16" fill="#607b49">kṛtvāse yathāsukham</text>
  </g>
  <g stroke="#486b70" stroke-width="4" fill="none" marker-end="url(#strilka)">
    <path d="M309 312 H331"/>
    <path d="M586 312 H608"/>
    <path d="M863 312 H885"/>
  </g>
  <rect x="112" y="462" width="976" height="88" rx="14" fill="#e9f0ee" stroke="#90a9a0" stroke-width="2"/>
  <text x="600" y="497" font-family="sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#254d4b">Не привласнювати дію ≠ не діяти</text>
  <text x="600" y="528" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#355a59">Третій і четвертий кроки містять реальну справу та її виконання.</text>
  <text x="600" y="593" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#5d6a6b">Сучасна редакторська інтерпретація, не історична ілюстрація і не науковий консенсус</text>
</svg>
