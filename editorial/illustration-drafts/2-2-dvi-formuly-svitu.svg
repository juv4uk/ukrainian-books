<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="schema-title schema-desc">
  <title id="schema-title">Аштавакра-ґіта 2.2: освітлення світу і дві формули</title>
  <desc id="schema-desc">Сучасна редакторська схема: усвідомлення спрямоване до тіла і світу; нижче дві альтернативні формули «Увесь світ — мій» та «Або ж — аніщо». Це не ствердження про фізичне зникнення світу.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#305E68"/>
    </marker>
  </defs>
  <rect width="1100" height="700" fill="#F8F5ED"/>
  <rect x="24" y="24" width="1052" height="652" rx="18" fill="none" stroke="#49636A" stroke-width="2"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#203B44">
    <text x="550" y="82" font-size="35" font-weight="bold">Коли світ стає явним</text>
    <text x="550" y="119" font-size="19">«Аштавакра-ґіта» · 2.2 · сучасна редакторська схема</text>
    <rect x="325" y="156" width="450" height="94" rx="16" fill="#E3ECEA" stroke="#47756F" stroke-width="3"/>
    <text x="550" y="214" font-size="29" font-weight="bold">«Я усвідомлюю»</text>
    <path d="M550 253 L550 310" stroke="#305E68" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="225" y="320" width="650" height="94" rx="16" fill="#F0E7D7" stroke="#997446" stroke-width="3"/>
    <text x="550" y="358" font-size="27" font-weight="bold">Тіло й світ</text>
    <text x="550" y="390" font-size="20">стають явними в усвідомленні</text>
    <text x="550" y="465" font-size="21" font-weight="bold">Другий рядок подає дві альтернативні формули</text>
    <rect x="76" y="493" width="438" height="101" rx="13" fill="#E5EFEA" stroke="#47756F" stroke-width="3"/>
    <rect x="586" y="493" width="438" height="101" rx="13" fill="#EEE7F0" stroke="#776184" stroke-width="3"/>
    <text x="295" y="557" font-size="28" font-weight="bold">«Увесь світ — мій»</text>
    <text x="805" y="557" font-size="28" font-weight="bold">«Або ж — аніщо»</text>
    <text x="550" y="633" font-size="18">Це зіставлення смислів, а не фізичних станів світу.</text>
  </g>
</svg>
