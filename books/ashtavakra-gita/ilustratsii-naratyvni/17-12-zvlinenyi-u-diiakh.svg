<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-17-12">
  <title id="t-17-12">Звільнений у звичайних діях</title>
  <desc>Наративна ілюстрація редакції до вірша 17.12: Людина йде повз чашу, квітку й плід, торкаючись їх, і ніщо її не тримає. Наша ілюстрація до вірша 17.12 — не історичне зображення. Фігури — силуети без облич.</desc>
