<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-15-14">
  <title id="t-15-14">Браслет і золото</title>
  <desc>Наративна ілюстрація редакції до вірша 15.14: Злиток золота на плиті й браслет поруч: окремо від золота браслет не сяє. Наша ілюстрація до вірша 15.14 — не історичне зображення. Фігури — силуети без облич.</desc>
