<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-17-3">
  <title id="t-17-3">Слон і гірке листя</title>
  <desc>Наративна ілюстрація редакції до вірша 17.3: Слон обходить гірке листя й тягнеться до пагонів, бо має свою втіху. Наша ілюстрація до вірша 17.3 — не історичне зображення. Фігури — силуети без облич.</desc>
