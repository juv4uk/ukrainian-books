<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-18-100">
  <title id="t-18-100">Ні до людей, ні до лісу — рівний скрізь</title>
  <desc>Дві сюжетні сцени до вірша 18.100: та сама людина серед людей і в лісі не біжить до жодного місця, зберігаючи рівність. Схема наша, не історична ілюстрація.</desc>
