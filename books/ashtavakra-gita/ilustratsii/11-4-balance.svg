<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-11-4">
  <title id="t-11-4">Дві шальки: народження й смерть, щастя й страждання</title>
  <desc>Власна схема редакції до вірша 11.4. Мотив: balance. Схема наша, не історична ілюстрація.</desc>
  <rect width="420" height="280" fill="#fbf8f1"/><rect x="0.5" y="0.5" width="419" height="279" fill="none" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="210" y1="92" x2="210" y2="196" stroke="#3b4a5a" stroke-width="2"/><line x1="90" y1="92" x2="330" y2="92" stroke="#3b4a5a" stroke-width="2"/><circle cx="210" cy="92" r="5" fill="#b0762a"/><path d="M90 92 L64 144 L116 144 Z" fill="none" stroke="#8aa0b5" stroke-width="1.4"/><line x1="90" y1="92" x2="90" y2="118" stroke="#8aa0b5" stroke-width="1"/><path d="M330 92 L304 144 L356 144 Z" fill="none" stroke="#8aa0b5" stroke-width="1.4"/><line x1="330" y1="92" x2="330" y2="118" stroke="#8aa0b5" stroke-width="1"/><text x="90" y="176" font-family="Georgia, 'DejaVu Serif', serif" font-size="11" fill="#3b4a5a" text-anchor="middle">щастя й народження</text><text x="330" y="176" font-family="Georgia, 'DejaVu Serif', serif" font-size="11" fill="#b0762a" text-anchor="middle">страждання й смерть</text><text x="210" y="240" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="middle">саме від долі — і він не забруднюється</text>
