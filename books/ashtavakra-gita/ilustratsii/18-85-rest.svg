<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-18-85">
  <title id="t-18-85">Людина лягає там, де зайшло сонце: вдоволення без вибору місця</title>
  <desc>Власна схема редакції до вірша 18.85. Мотив: rest. Схема наша, не історична ілюстрація.</desc>
