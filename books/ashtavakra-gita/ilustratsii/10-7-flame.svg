<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="zagolovok opis">
  <title id="zagolovok">Ліс сансари — мандрівник не знаходить спочинку (Аштавакра-ґіта 10.7)</title>
  <desc id="opis">Власна сучасна українська сюжетна ілюстрація: людина з торбиною стоїть на звивистій лісовій стежці. Праворуч дерев’яний вказівник має три таблички «Багатство», «Бажання», «Заслуги». Стежка повертається у темний ліс, а відкрита лавка відпочинку лишається осторонь. Образ показує думку вірша про розум, який у лісі сансари не знаходить відпочинку. Це не історичне індійське зображення, не рукописний доказ і не свідчення культурного впливу.</desc>
