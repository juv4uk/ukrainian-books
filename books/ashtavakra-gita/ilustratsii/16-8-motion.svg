<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-16-8">
  <title id="t-16-8">Потяг і відраза, а поза ними — дитина</title>
  <desc>Власна схема редакції до вірша 16.8. Мотив: motion. Схема наша, не історична ілюстрація.</desc>
  <rect width="420" height="280" fill="#fbf8f1"/><rect x="0.5" y="0.5" width="419" height="279" fill="none" stroke="#c9d3dd" stroke-width="1"/>
  <circle cx="40" cy="56" r="4" fill="#b0762a"/><text x="54" y="61" font-family="Georgia, 'DejaVu Serif', serif" font-size="11" fill="#3b4a5a" text-anchor="start">дієш — народжується потяг</text><path d="M196 56 C222 56 214 73.0 232 73.0" stroke="#8aa0b5" fill="none" stroke-width="1.4"/><circle cx="40" cy="90" r="4" fill="#b0762a"/><text x="54" y="95" font-family="Georgia, 'DejaVu Serif', serif" font-size="11" fill="#3b4a5a" text-anchor="start">спиняєшся — відраза</text><path d="M196 90 C222 90 214 73.0 232 73.0" stroke="#8aa0b5" fill="none" stroke-width="1.4"/><circle cx="238" cy="73.0" r="6" fill="#b0762a"/><text x="256" y="69.0" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="start">вільний від пари</text><text x="256" y="86.0" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="start">стоїть, як стоїть</text><text x="256" y="103.0" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="start">дитина</text>
  <text x="20" y="272" font-family="Georgia, 'DejaVu Serif', serif" font-size="10" fill="#8aa0b5" text-anchor="start" font-style="italic">Схема наша, не історична ілюстрація</text><text x="400" y="272" font-family="Georgia, 'DejaVu Serif', serif" font-size="10" fill="#8aa0b5" text-anchor="end">ФОРМАТ-02</text>
</svg>
