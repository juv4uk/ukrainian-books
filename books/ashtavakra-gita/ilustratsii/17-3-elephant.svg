<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-17-3">
  <title id="t-17-3">Слон біля соковитої гілки відвертається від гіркого листя німби</title>
  <desc>Власна схема редакції до вірша 17.3. Мотив: elephant. Схема наша, не історична ілюстрація.</desc>
  <rect width="420" height="280" fill="#fbf8f1"/><rect x="0.5" y="0.5" width="419" height="279" fill="none" stroke="#c9d3dd" stroke-width="1"/>
