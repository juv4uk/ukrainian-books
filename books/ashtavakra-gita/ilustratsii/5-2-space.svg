<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-5-2">
  <title id="t-5-2">Бульбашка й океан: світ постає з тебе</title>
  <desc>Власна схема редакції до вірша 5.2. Мотив: space. Схема наша, не історична ілюстрація.</desc>
  <rect width="420" height="280" fill="#fbf8f1"/><rect x="0.5" y="0.5" width="419" height="279" fill="none" stroke="#c9d3dd" stroke-width="1"/>
  <path d="M150 70 q-26 40 -26 78 q0 46 30 66 q26 16 62 16 q36 0 62 -16 q30 -20 30 -66 q0 -38 -26 -78" fill="none" stroke="#3b4a5a" stroke-width="2"/><path d="M150 70 q60 -14 120 0" fill="none" stroke="#3b4a5a" stroke-width="2"/><line x1="212" y1="40" x2="212" y2="214" stroke="#8aa0b5" stroke-width="1" stroke-dasharray="3 4"/><line x1="40" y1="214" x2="380" y2="214" stroke="#8aa0b5" stroke-width="1" stroke-dasharray="3 4"/><text x="262" y="116" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="start">той самий</text><text x="262" y="134" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="start">простір</text><text x="40" y="56" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">стінки ділять посуд,</text><text x="40" y="74" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">а не простір</text><text x="40" y="236" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="start">світ постає з тебе, як бульбашка з океану</text>
  <text x="20" y="272" font-family="Georgia, 'DejaVu Serif', serif" font-size="10" fill="#8aa0b5" text-anchor="start" font-style="italic">Схема наша, не історична ілюстрація</text><text x="400" y="272" font-family="Georgia, 'DejaVu Serif', serif" font-size="10" fill="#8aa0b5" text-anchor="end">ФОРМАТ-02</text>
