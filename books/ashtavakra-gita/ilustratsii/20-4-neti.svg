<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-20-4">
  <title id="t-20-4">Діяння й безтілесне звільнення відпали</title>
  <desc>Власна схема редакції до вірша 20.4. Мотив: neti. Схема наша, не історична ілюстрація.</desc>
  <rect width="420" height="280" fill="#fbf8f1"/><rect x="0.5" y="0.5" width="419" height="279" fill="none" stroke="#c9d3dd" stroke-width="1"/>
  <text x="40" y="50" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">запущені в дію діяння</text><line x1="36" y1="46" x2="216" y2="46" stroke="#8aa0b5" stroke-width="1.2"/><text x="40" y="76" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">звільнення ще за життя</text><line x1="36" y1="72" x2="224" y2="72" stroke="#8aa0b5" stroke-width="1.2"/><text x="40" y="102" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">безтілесне кайвальям</text><line x1="36" y1="98" x2="208" y2="98" stroke="#8aa0b5" stroke-width="1.2"/><line x1="30" y1="134" x2="390" y2="134" stroke="#c9d3dd" stroke-width="1"/><circle cx="46" cy="160" r="5" fill="#b0762a"/><text x="62" y="164" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="start">у того, хто завжди без ознак</text>
  <text x="20" y="272" font-family="Georgia, 'DejaVu Serif', serif" font-size="10" fill="#8aa0b5" text-anchor="start" font-style="italic">Схема наша, не історична ілюстрація</text><text x="400" y="272" font-family="Georgia, 'DejaVu Serif', serif" font-size="10" fill="#8aa0b5" text-anchor="end">ФОРМАТ-02</text>
</svg>
