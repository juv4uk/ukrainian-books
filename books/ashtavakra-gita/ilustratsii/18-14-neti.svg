<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-18-14">
  <title id="t-18-14">Омана, світ, споглядання й свобода відпали</title>
  <desc>Власна схема редакції до вірша 18.14. Мотив: neti. Схема наша, не історична ілюстрація.</desc>
  <rect width="420" height="280" fill="#fbf8f1"/><rect x="0.5" y="0.5" width="419" height="279" fill="none" stroke="#c9d3dd" stroke-width="1"/>
