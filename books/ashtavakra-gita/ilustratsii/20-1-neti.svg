<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="t-20-1">
  <title id="t-20-1">Першоелементи й розум відпали: лишається власна форма</title>
  <desc>Власна схема редакції до вірша 20.1. Мотив: neti. Схема наша, не історична ілюстрація.</desc>
