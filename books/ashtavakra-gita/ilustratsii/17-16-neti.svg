  <text x="40" y="50" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">насильство</text><line x1="36" y1="46" x2="128" y2="46" stroke="#8aa0b5" stroke-width="1.2"/><text x="40" y="76" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">жаль</text><line x1="36" y1="72" x2="80" y2="72" stroke="#8aa0b5" stroke-width="1.2"/><text x="40" y="102" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">зарозумілість</text><line x1="36" y1="98" x2="152" y2="98" stroke="#8aa0b5" stroke-width="1.2"/><text x="40" y="128" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">приниженість</text><line x1="36" y1="124" x2="144" y2="124" stroke="#8aa0b5" stroke-width="1.2"/><text x="40" y="154" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">здивування</text><line x1="36" y1="150" x2="128" y2="150" stroke="#8aa0b5" stroke-width="1.2"/><text x="40" y="180" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#8aa0b5" text-anchor="start">збурення</text><line x1="36" y1="176" x2="112" y2="176" stroke="#8aa0b5" stroke-width="1.2"/><line x1="30" y1="212" x2="390" y2="212" stroke="#c9d3dd" stroke-width="1"/><circle cx="46" cy="238" r="5" fill="#b0762a"/><text x="62" y="242" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="start">нічого цього немає в тому, в</text><text x="62" y="259" font-family="Georgia, 'DejaVu Serif', serif" font-size="12" fill="#b0762a" text-anchor="start">кого скінчилося блукання</text>
