name: Складання власних видань
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    name: XeLaTeX — власні дозволені книги
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити права й джерела
        run: python3 scripts/check_project.py
      - name: Блокувати складання без підтвердженого паспорта походження
        run: python3 scripts/check_provenance.py
      - name: Перевірити наявність книжкових джерел
        id: detect
        shell: bash
        run: |
          if [ -d books ] && find books -name main.tex -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Дозволених до публікації власних TeX-видань поки немає." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Перевірити закомічену верстку (тести)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_pilot_book.py' -v
      - name: Згенерувати верстку з усіх карток реєстру
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Закомічений generated/verses.tex покриває 14 глав: файл на 20 глав
          # важить 687 КБ і оновлюється лише клоном. Для самого PDF це не має
          # значення: реєстр повний (298 карток), тому верстку збираємо з усіх
          # 20 глав, перевизначивши список у пам'яті. Тест вище перевіряє саме
          # закомічений стан і про це перевизначення нічого не знає.
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import build_pilot_book as builder
          builder.PILOT_CHAPTERS = tuple(range(1, 21))
          raise SystemExit(builder.main())
          PY
      - name: Згенерувати поетичний том
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Поетичний переклад живе в books/ashtavakra-gita/poetychnyi/*.md,
          # а окремий том підключає згенерований poems.tex. Файл не комітимо:
          # він похідний від розділів, і джерело істини — саме розділи.
          python3 scripts/build_poetic_book.py
      - name: Встановити XeLaTeX
        if: steps.detect.outputs.found == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            texlive-xetex texlive-lang-cyrillic texlive-latex-recommended \
            texlive-fonts-recommended latexmk fonts-dejavu-core poppler-utils \
            fonts-noto-core fonts-lohit-deva
      - name: Згенерувати власні схеми до віршів (SVG → PDF)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check cairosvg
          # Звірка актуальності НЕ блокує збірку: частина ілюстрацій у каталозі —
          # ручні сюжетні малюнки, яких генератор схем не відтворює, і вони
          # закономірно «застарілі» з його погляду.
          python3 scripts/build_verse_schemas.py --check \
            || echo "::warning::Частина схем — ручні ілюстрації; генератор їх не відтворює"
          python3 scripts/build_verse_schemas.py --pdf
          python3 scripts/build_format_v2_chapter.py --check
      - name: Долучити власні схеми до віршів
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Крок стоїть ПІСЛЯ конвертації SVG → PDF: скрипт долучає лише ті
          # схеми, чий PDF уже існує. Інакше посилання на неконвертовану
          # ручну ілюстрацію ламало б latexmk.
          python3 scripts/attach_figures.py
      - name: Зібрати дозволені книги
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            [ -f "$dir/PROVENANCE.md" ] || { echo "Немає паспорта походження у $dir"; exit 1; }
            (cd "$dir" && latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex)
          done < <(find books -name main.tex -print0)
      - name: Перевірити PDF, кирилицю та діакритику IAST
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for pdf in books/*/*.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            size="$(stat -c %s "$pdf")"
            text="$(pdftotext -enc UTF-8 "$pdf" -)"
            echo "### $pdf" >> "$GITHUB_STEP_SUMMARY"
            echo "- сторінок: $pages" >> "$GITHUB_STEP_SUMMARY"
            echo "- розмір: $size байт" >> "$GITHUB_STEP_SUMMARY"
            [ -s "$pdf" ] || { echo "Порожній файл: $pdf"; fail=1; }
            [ "${pages:-0}" -gt 1 ] || { echo "Неочікувана кількість сторінок: $pages"; fail=1; }
            grep -Fq "РОБОЧЕ ПІЛОТНЕ ВИДАННЯ" <<< "$text" \
              || { echo "Титул не проголошує пілот: $pdf"; fail=1; }
            grep -Fq "ґіта" <<< "$text" || { echo "Немає української кирилиці: $pdf"; fail=1; }
            case "$pdf" in
              */ashtavakra-poetychnyi/*)
                # У поетичному томі IAST немає за задумом: це чистий переклад.
                grep -Fq "АШТАВАКРА" <<< "$text" \
                  || { echo "Немає титулу поетичного тому: $pdf"; fail=1; }
                ;;
              *)
                grep -Fq "Aṣṭāvakragītā" <<< "$text" \
                  || { echo "Немає діакритики IAST: $pdf"; fail=1; }
                ;;
            esac
          done
          for log in books/*/main.log; do
            if grep -q "Missing character" "$log"; then
              echo "Відсутні гліфи у шрифті: $log"
              grep "Missing character" "$log" | sort -u | head -20
              fail=1
            fi
            echo "- Overfull hbox у $(dirname "$log"): $(grep -c 'Overfull \\hbox' "$log" || true)" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$fail"
      - name: Зберегти PDF
        if: steps.detect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ukrainski-vydannia
          path: books/**/*.pdf
          if-no-files-found: error
