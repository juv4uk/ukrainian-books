name: Технічна перевірка українського PDF

on:
  pull_request:
    paths:
      - "tests/fixtures/pdf-smoke-ukr.tex.in"
      - ".github/workflows/pdf-smoke.yml"
  push:
    branches: [main]
    paths:
      - "tests/fixtures/pdf-smoke-ukr.tex.in"
      - ".github/workflows/pdf-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: XeLaTeX, кирилиця та PDF-артефакт
    runs-on: ubuntu-latest
    steps:
      - name: Отримати вихідні файли
        uses: actions/checkout@v4
      - name: Перевірити структуру й «ВОЛЬНІСТЬ»
        run: python3 scripts/check_project.py
      - name: Установити XeLaTeX та PDF-утиліти
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            texlive-xetex texlive-lang-cyrillic texlive-latex-recommended \
            latexmk fonts-dejavu-core fonts-noto-core poppler-utils
      - name: Скласти контрольний PDF
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ukr-pdf-smoke/out"
          cp tests/fixtures/pdf-smoke-ukr.tex.in "$RUNNER_TEMP/ukr-pdf-smoke/pdf-smoke-ukr.tex"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -outdir="$RUNNER_TEMP/ukr-pdf-smoke/out" "$RUNNER_TEMP/ukr-pdf-smoke/pdf-smoke-ukr.tex"
          test -s "$RUNNER_TEMP/ukr-pdf-smoke/out/pdf-smoke-ukr.pdf"
      - name: Перевірити сторінку та кирилицю
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/ukr-pdf-smoke/out/pdf-smoke-ukr.pdf"
          pages="$(pdfinfo "$file" | awk '/^Pages:/ {print $2}')"
          test "$pages" = "1" || { echo "Неочікувана кількість сторінок: $pages"; exit 1; }
          pdftotext -enc UTF-8 "$file" - | grep -Fq "Українська контрольна сторінка"
          echo "PDF містить одну сторінку й перевірену українську кирилицю." >> "$GITHUB_STEP_SUMMARY"
      - name: Перевірити деванагарі без окремого workflow
        shell: bash
        run: |
          set -euo pipefail
          original="research/typesetting-devanagari/proof.latex.txt"
          test -f "$original"
          fc-match -f '%{family}\n' 'Noto Serif Devanagari' | grep -Fq 'Noto Serif Devanagari'
          cp "$original" "$RUNNER_TEMP/ukr-pdf-smoke/druk-01-proof.tex"
          output="$RUNNER_TEMP/ukr-pdf-smoke/out"
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory="$output" "$RUNNER_TEMP/ukr-pdf-smoke/druk-01-proof.tex"
          pdf="$output/druk-01-proof.pdf"
          test -s "$pdf"
          pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
          test "$pages" = 1
          if grep -Fq 'Missing character' "$output/druk-01-proof.log"; then
            echo 'Деванагарі: відсутній гліф' >&2
            exit 1
          fi
          pdffonts "$pdf" | grep -Fq 'NotoSerifDevanagari'
          pdffonts "$pdf" | grep -Fq 'DejaVuSerif'
          pdftotext -enc UTF-8 "$pdf" - | grep -Fq 'Шрифти української наукової книги'
          pdftotext -enc UTF-8 "$pdf" - | grep -Fq 'ātmā'
          pdftoppm -f 1 -l 1 -r 160 -png -singlefile "$pdf" "$output/druk-01-proof"
          test -s "$output/druk-01-proof.png"
          {
            echo 'Проба деванагарі зібрана: одна сторінка, кирилиця, IAST, вбудований Noto Serif Devanagari.'
            echo 'Увага: PDF/PNG — лише технічні зразки, не дозвіл на публікацію санскритського тексту.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Зберегти технічний PDF
        uses: actions/upload-artifact@v4
        with:
          name: tehnichnyi-pdf-kirylytsia
          path: |
            ${{ runner.temp }}/ukr-pdf-smoke/out/pdf-smoke-ukr.pdf
            ${{ runner.temp }}/ukr-pdf-smoke/out/druk-01-proof.pdf
            ${{ runner.temp }}/ukr-pdf-smoke/out/druk-01-proof.png
          if-no-files-found: error
          retention-days: 7
