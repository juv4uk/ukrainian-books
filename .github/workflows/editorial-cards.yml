name: Редакторські картки — перевірка походження та рецензій
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-cards:
    name: Схема карток і синтетичні тести
    runs-on: ubuntu-latest
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
      - name: Виконати unit-тести
        run: python3 -m unittest discover -s tests -p 'test_editorial_cards.py' -v
      - name: Виконати тести перевірки прогалин
        run: python3 -m unittest discover -s tests -p 'test_verse_gaps.py' -v
      - name: Виконати тести цілісності текстів
        run: python3 -m unittest discover -s tests -p 'test_card_text.py' -v
      - name: Виконати тести пошуку однакового тексту
        run: python3 -m unittest discover -s tests -p 'test_duplicate_text.py' -v
      - name: Перевірити редакторські картки
        run: python3 scripts/check_editorial_cards.py
      - name: Звіт про прогалини в нумерації (не блокує)
        run: python3 scripts/check_verse_gaps.py
      - name: Звіт про обірвані текстові поля (не блокує)
        run: python3 scripts/check_card_text.py
      - name: Звіт про однакове читання в різних картках (не блокує)
        run: python3 scripts/check_duplicate_text.py
      - name: Перевірити структуру, посилання й ліцензію
        run: python3 scripts/check_project.py
