name: Контроль походження видань
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Перевірка паспортів і негативні тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити негативні сценарії
        run: python3 -m unittest discover -s tests -p 'test_check_provenance.py' -v
      - name: Перевірити паспорти книг
        run: python3 scripts/check_provenance.py --report reports/provenance.json
      - name: Завантажити звіт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provenance-audit
          path: reports/provenance.json
          if-no-files-found: ignore
