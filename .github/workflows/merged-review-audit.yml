name: УКР-07 — ретроспективні GitHub Reviews
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Синтетичні перевірки ретроспективної рецензії
    runs-on: ubuntu-latest
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
      - name: Виконати незалежні синтетичні тести
        run: python3 -m unittest discover -s tests -p 'test_merged_reviews.py' -v
      - name: Перевірити структуру й ліцензію
        run: python3 scripts/check_project.py

  report:
    name: Ручний read-only аудит злитих PR
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
      - name: Показати доказовий звіт без змін PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_merged_reviews.py --repo juv4uk/ukrainian-books --limit 25
