name: Науковий формат — офлайнові тести

on:
  pull_request:
    paths:
      - 'scripts/check_scholarly_pages.py'
      - 'scripts/build_format_v2_chapter.py'
      - 'tests/test_scholarly_pages.py'
      - 'tests/test_scholarly_pages_match_generator.py'
      - 'books/*/rozdil-*-naukove.md'
      - 'docs/FORMAT_V2.md'
      - '.github/workflows/scholarly-format.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check_scholarly_pages.py'
      - 'scripts/build_format_v2_chapter.py'
      - 'tests/test_scholarly_pages.py'
      - 'tests/test_scholarly_pages_match_generator.py'
      - 'books/*/rozdil-*-naukove.md'
      - 'docs/FORMAT_V2.md'
      - '.github/workflows/scholarly-format.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Наукові сторінки — перевірка, канон і генератор разом
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Завантажити репозиторій
        uses: actions/checkout@v4
      - name: Перевірити наукові шари, українські паралелі та SVG
        run: python3 -m unittest discover -s tests -p 'test_scholarly_pages.py' -v
      - name: Перевірити, що генератор і перевірка не розійшлися в маркерах
        run: python3 -m unittest discover -s tests -p 'test_scholarly_pages_match_generator.py' -v
      - name: Перевірити всі 20 книжкових глав
        run: python3 scripts/check_scholarly_pages.py books/ashtavakra-gita/rozdil-*-naukove.md
